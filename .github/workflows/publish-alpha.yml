name: Publish Alpha podverse-external-services

on:
  push:
    branches:
      - v5-alpha

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Set podverse-helpers dependency versions to latest alpha
        run: |
          PKG_NAME=podverse-helpers
          # Try to get the dist-tag 'alpha' version first
          ALPHA_VERSION=$(npm dist-tag ls "$PKG_NAME" 2>/dev/null | grep -w alpha | awk '{print $2}')

          # Fallback to view @alpha if dist-tag listing didn't return
          if [[ -z "$ALPHA_VERSION" ]]; then
            ALPHA_VERSION=$(npm view "$PKG_NAME"@alpha version 2>/dev/null || true)
          fi

          if [[ -z "$ALPHA_VERSION" ]]; then
            echo "No alpha version found for $PKG_NAME; skipping peerDependency update"
            exit 0
          fi

          echo "Found $PKG_NAME alpha version: $ALPHA_VERSION"

          # Update package.json peerDependencies.podverse-helpers and devDependencies to the found version
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.peerDependencies=p.peerDependencies||{};p.devDependencies=p.devDependencies||{};p.peerDependencies['podverse-helpers']='$ALPHA_VERSION';p.devDependencies['podverse-helpers']='$ALPHA_VERSION';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');console.log('Updated package.json peerDependencies.podverse-helpers -> $ALPHA_VERSION and devDependencies.podverse-helpers -> $ALPHA_VERSION');"

          # Also install the alpha into node_modules without modifying package.json as a fallback
          npm install "$PKG_NAME@$ALPHA_VERSION" --no-save || true
      
      - name: Generate temp package-lock.json
        run: npm install --package-lock-only
      
      - name: Clean install dependencies
        run: npm clean-install
      
      - name: Increment alpha version
        id: version
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          BASE_VERSION=$(node -p "require('./package.json').version")
          # Strip any pre-release tag (e.g., '-develop') from BASE_VERSION
          BASE_VERSION=$(echo "$BASE_VERSION" | sed 's/-.*//')

          # Try to get the current alpha version (e.g., 5.1.1-alpha.3)
          ALPHA_VERSION=$(npm dist-tag ls "$PACKAGE_NAME" 2>/dev/null | grep -w alpha | awk '{print $2}')

          # If no alpha tag exists
          if [[ -z "$ALPHA_VERSION" ]]; then
            echo "No alpha version found. Starting with: $BASE_VERSION-alpha.0"
            NEXT_VERSION="$BASE_VERSION-alpha.0"
          else
            # Extract the base and numeric suffix from the current alpha version
            CURRENT_BASE=$(echo "$ALPHA_VERSION" | cut -d '-' -f 1)
            CURRENT_ALPHA_NUM=$(echo "$ALPHA_VERSION" | sed -En 's/.*alpha\.([0-9]+)$/\1/p')

            # If current alpha is malformed or suffix missing
            if [[ -z "$CURRENT_ALPHA_NUM" ]]; then
              NEXT_VERSION="$BASE_VERSION-alpha.0"
            fi

            if [[ "$CURRENT_BASE" == "$BASE_VERSION" ]]; then
              NEXT_INDEX=$((CURRENT_ALPHA_NUM + 1))
              NEXT_VERSION="$BASE_VERSION-alpha.$NEXT_INDEX"
              echo "Same base version detected. Incrementing alpha to: $NEXT_VERSION"
            else
              NEXT_VERSION="$BASE_VERSION-alpha.0"
              echo "New base version detected. Resetting alpha to: $NEXT_VERSION"
            fi
          fi
          
          echo "Updating package.json"
          npm version $NEXT_VERSION --no-git-tag-version
      
      - name: Build module
        run: npm run build
      
      - name: Publish to npm
        run: npm publish --tag alpha
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ALPHA_NPM_TOKEN }}
